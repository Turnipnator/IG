name: Secret scan

# This repository is PUBLIC and carries live broker credentials in its runtime
# environment. Nothing has leaked (history was checked by hand on 2026-08-21 and
# was clean) — this exists so that stays true without anyone having to remember.
#
# gitleaks-action is free here: the licence requirement applies to
# organization-owned repositories, not personal public ones.
#
# On push/pull_request the action scans only the DIFF RANGE (--log-opts limits
# it to base..head). A genuine full-history scan happens only on schedule or
# workflow_dispatch, so the monthly cron below is what keeps the full-history
# guarantee real rather than assumed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 04:23 UTC on the 1st — off-hour and off-the-hour, per GitHub's own note
    # that scheduled events queue up and are delayed at the top of each hour.
    #
    # NB: GitHub auto-disables scheduled workflows in a public repo after 60
    # days of no repository activity. At a monthly cadence that is two missed
    # runs, so workflow_dispatch above is the manual escape hatch.
    - cron: "23 4 1 * *"

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a shallow clone silently scans almost nothing
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
